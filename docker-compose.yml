services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # The host path is used only by the bind mount; the app always reads the container path.
      # 宿主机路径只用于 bind mount，应用容器内统一从 /data/media 读写。
      NAS_MEDIA_PATH: /data/media
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${NAS_MEDIA_PATH:?Set NAS_MEDIA_PATH in .env.docker}
        target: /data/media
    ports:
      - "3000:3000"
    networks:
      - fg

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Force HTTP/2 when outbound UDP/7844 is unavailable on the server network.
    # 服务器网络无法稳定使用 UDP/7844 时固定走 HTTP/2，避免自动切回 QUIC。
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      # The token is injected from the ignored host env file and never committed.
      # Token 只从未提交的宿主机环境文件注入，禁止写入仓库。
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env.docker}
    depends_on:
      - app
    networks:
      - fg

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fg_studio}
      POSTGRES_USER: ${POSTGRES_USER:-fg_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fg

networks:
  fg:
    name: fg-studio

volumes:
  postgres-data:
