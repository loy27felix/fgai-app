x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "10"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DEPLOYMENT_VERSION: ${APP_DEPLOYMENT_VERSION:-dev}
    # The NAS supervisor owns app lifecycle so Docker cannot start it against an unmounted host directory.
    # App 生命周期由 NAS 守护进程管理，禁止 Docker 在宿主机目录未挂载时抢先启动。
    restart: "no"
    # Use resolvers that resolve wetoken.ai when the LAN resolver returns SERVFAIL.
    # 局域网 DNS 对 wetoken.ai 返回 SERVFAIL 时，改用公网 DNS，避免 Provider 主域名无法解析。
    dns:
      - 223.5.5.5
      - 1.1.1.1
    env_file:
      - .env.docker
    environment:
      # The host path is used only by the bind mount; the app always reads the container path.
      # 宿主机路径只用于 bind mount，应用容器内统一从 /data/media 读写。
      NAS_MEDIA_PATH: /data/media
      NAS_READY_FILE: /data/media/.fg-studio-nas-ready
    command:
      - sh
      - -c
      - |
        set -e
        test -f "$${NAS_READY_FILE}" || { echo "NAS media storage is unavailable" >&2; exit 78; }
        node scripts/local-db-migrate.mjs
        exec node server.js
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${NAS_MEDIA_PATH:?Set NAS_MEDIA_PATH in .env.docker}
        target: /data/media
        bind:
          create_host_path: false
    ports:
      # Keep the app reachable only from the Docker host; HTTPS is terminated by Nginx.
      # App 仅供宿主机回环和 Docker network 访问，HTTPS 由 Nginx 统一终止。
      - "127.0.0.1:${FG_APP_HOST_PORT:-3000}:3000"
    healthcheck:
      # Standalone Next binds to the container hostname; probe its lightweight public endpoint without rendering the homepage.
      # Standalone Next 监听容器 hostname；使用轻量公开接口检查就绪状态，避免渲染首页。
      test: ["CMD-SHELL", "test -f \"$${NAS_READY_FILE}\" && node -e \"const h=require('os').hostname(); fetch('http://'+h+':3000/api/version').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - fg

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DEPLOYMENT_VERSION: ${APP_DEPLOYMENT_VERSION:-dev}
    restart: unless-stopped
    # The worker only calls the authenticated internal endpoint; provider work is durable in Postgres.
    # worker 只调用带密钥的内部端点，Provider 提交进度持久化在 Postgres，不依赖 app 请求进程存活。
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -u
        while true; do
          node -e '
            const secret = process.env.FG_OBSERVABILITY_SECRET || process.env.SESSION_SECRET || "";
            fetch("http://app:3000/api/internal/video-task-worker", {
              method: "POST",
              headers: { "x-fg-observability-secret": secret },
            }).then(async (response) => {
              await response.arrayBuffer();
              if (!response.ok) process.exitCode = 1;
            }).catch(() => { process.exitCode = 1; });
          '
          sleep 5
        done
    networks:
      - fg
    logging: *default-logging

  nginx:
    image: nginx:stable-alpine
    profiles:
      - https
    restart: unless-stopped
    # Wait for the upstream app before accepting HTTPS traffic.
    # 等待上游 App 健康后再接收 HTTPS 流量，避免启动瞬间返回 502。
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FG_NGINX_HOST_PORT:-3000}:443"
    volumes:
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${FG_NGINX_CERT_PATH:-/var/empty/fg-studio-certificate.pem}
        target: /etc/nginx/tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FG_NGINX_KEY_PATH:-/var/empty/fg-studio-private-key.pem}
        target: /etc/nginx/tls/server.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/api/version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - fg

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Force HTTP/2 when outbound UDP/7844 is unavailable on the server network.
    # 服务器网络无法稳定使用 UDP/7844 时固定走 HTTP/2，避免自动切回 QUIC。
    command: tunnel --metrics 0.0.0.0:20241 --no-autoupdate --protocol http2 run
    environment:
      # The token is injected from the ignored host env file and never committed.
      # Token 只从未提交的宿主机环境文件注入，禁止写入仓库。
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env.docker}
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready", "--metrics", "127.0.0.1:20241"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    networks:
      - fg
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fg_studio}
      POSTGRES_USER: ${POSTGRES_USER:-fg_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fg
    logging: *default-logging

networks:
  fg:
    name: fg-studio

volumes:
  postgres-data:
