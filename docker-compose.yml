services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # The NAS supervisor owns app lifecycle so Docker cannot start it against an unmounted host directory.
    # App 生命周期由 NAS 守护进程管理，禁止 Docker 在宿主机目录未挂载时抢先启动。
    restart: "no"
    env_file:
      - .env.docker
    environment:
      # The host path is used only by the bind mount; the app always reads the container path.
      # 宿主机路径只用于 bind mount，应用容器内统一从 /data/media 读写。
      NAS_MEDIA_PATH: /data/media
      NAS_READY_FILE: /data/media/.fg-studio-nas-ready
    command:
      - sh
      - -c
      - |
        test -f "$${NAS_READY_FILE}" || { echo "NAS media storage is unavailable" >&2; exit 78; }
        node scripts/local-db-migrate.mjs
        exec node server.js
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${NAS_MEDIA_PATH:?Set NAS_MEDIA_PATH in .env.docker}
        target: /data/media
        bind:
          create_host_path: false
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "test -f \"$${NAS_READY_FILE}\""]
      interval: 10s
      timeout: 3s
      retries: 2
      start_period: 10s
    networks:
      - fg

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Force HTTP/2 when outbound UDP/7844 is unavailable on the server network.
    # 服务器网络无法稳定使用 UDP/7844 时固定走 HTTP/2，避免自动切回 QUIC。
    command:
      - sh
      - -c
      - |
        cloudflared tunnel --metrics 0.0.0.0:20241 --no-autoupdate --protocol http2 run &
        tunnel_pid=$$!
        # Restart the connector when it stays disconnected; Docker then re-resolves the Edge address.
        # 连接持续断开时主动退出，让 Docker 重启并重新解析 Cloudflare Edge 地址。
        while kill -0 "$${tunnel_pid}" 2>/dev/null; do
          sleep 30
          cloudflared tunnel ready --metrics 127.0.0.1:20241 >/dev/null 2>&1 || {
            kill "$${tunnel_pid}" 2>/dev/null || true
            wait "$${tunnel_pid}" || true
            exit 1
          }
        done
        wait "$${tunnel_pid}"
    environment:
      # The token is injected from the ignored host env file and never committed.
      # Token 只从未提交的宿主机环境文件注入，禁止写入仓库。
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env.docker}
    depends_on:
      - app
    networks:
      - fg

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fg_studio}
      POSTGRES_USER: ${POSTGRES_USER:-fg_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fg

networks:
  fg:
    name: fg-studio

volumes:
  postgres-data:
