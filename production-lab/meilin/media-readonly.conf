# Dedicated origin for sixth-module signed media. No platform API or workspace.
server {
  listen 8080 default_server;
  server_name _;
  server_tokens off;
  location ~ "^/api/public/resources/([0-9a-f]{32}|[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12})/file$" {
    limit_except GET HEAD { deny all; }
    proxy_pass http://fg-six-yingce-gateway-1:3010;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Origin "";
    proxy_set_header X-Canvas-Upstream-Headers "";
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 120s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
  }
  location / { return 404; }
}
