interface:
  display_name: "TYGG AI 影片工作室"
  short_description: "恢复连续剧情与偏好，同轮展示剧本分镜，用可弯曲代理和圆滑镜头交付视频参考"
  default_prompt: "使用 $tygg-ai-film-studio，先复用已明确的项目目录，目录缺失时在聊天中询问，确定后才在项目内写文件；再恢复项目或明确本轮范围，默认在正文逐题提供三个候选及自由补充入口，正文受限时在已确定项目内交付问题文档；同轮展示剧本与分镜，准备人物设定板，用可弯曲圆柱球头和圆滑镜头完成分阶段预演，再交付参考视频、素材职责明确的Seedance提示词与续作记录。"
