    # FG sixth module only: every request retains the existing FG session gate.
    location = /fg-six { return 308 /fg-six/; }
    location ^~ /fg-six/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_public_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_public_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
    location = /fg-audio-tools { return 307 /fg-six/fg-audio-tools$is_args$args; }
    location = /fg-director { return 307 /app; }
    location = /fg-director/ { return 307 /app; }
    location ~ ^/(?:fg-director/|app(?:/|$)|api/v1(?:/|$)|mcp(?:/|$)|agent-installation-guide\.md$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_director_public_upstream fg-six-yingce-gateway-1:3020;
        proxy_pass http://$fg_director_public_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ~ ^/(?:creator-app$|creator-static/|creator-presets/|\.opencreator/|fonts/opencreator/|dashboard/.+\.(?:png|jpe?g|webp|svg|mp4)$|platforms/.+\.png$|advertising-app/|adcraft-api/|adcraft-static/|director-desk/) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_tool_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_tool_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
    # Provider-only delivery uses native, expiring HMAC signed URLs. Other FG
    # or canvas APIs stay behind their existing authentication gates.
    location ~ "^/api/public/resources/([0-9a-f]{32}|[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12})/file$" {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_media_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_media_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /production-lab {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_entry_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_entry_upstream/fg/entry;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /production-lab/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_entry_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_entry_upstream/fg/entry;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
