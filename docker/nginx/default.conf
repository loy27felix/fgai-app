server {
    listen 80;
    server_name _;

    # Keep upload limits in the application so Nginx does not reject media first.
    # 上传限制由应用统一校验，避免 Nginx 提前拒绝媒体文件。
    client_max_body_size 0;

    location / {
        # Resolve the app again after the NAS supervisor recreates its container.
        # NAS 守护进程重建 App 容器后重新解析地址，避免缓存旧容器 IP。
        resolver 127.0.0.11 valid=10s;
        set $app_upstream http://app:3000;
        proxy_pass $app_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
