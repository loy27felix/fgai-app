# Forward upgrade requests for any future WebSocket or streaming endpoint.
# 为后续 WebSocket 或 streaming endpoint 保留 upgrade 转发能力。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream fg_studio_app {
    # Resolve the Compose service on the shared Docker network.
    # 通过共享 Docker network 访问 Compose 中的 App service。
    server app:3000;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 192.168.0.99 localhost 127.0.0.1;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Asset uploads and video responses can be large; the app validates exact limits.
    # 素材上传和视频响应可能较大，具体业务限制仍由 App 校验。
    client_max_body_size 500m;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://fg_studio_app;
        # Preserve the public authority, including a non-standard HTTPS port.
        # 保留公网 authority（包括非标准 HTTPS 端口），否则 Next Server Action 会拒绝跨代理请求。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Stream media and long-running generation requests without a proxy cutoff.
        # 媒体和长耗时生成请求采用流式转发，避免 Nginx 缓冲或过早超时。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
