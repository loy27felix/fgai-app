# Forward upgrade requests for any future WebSocket or streaming endpoint.
# 为后续 WebSocket 或 streaming endpoint 保留 upgrade 转发能力。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $status $fg_log_5xx {
    ~^5 1;
    default 0;
}

# Observe entry latency without logging cookies, query strings or request bodies.
map $uri $fg_log_entry_timing {
    default 0;
    / 1;
    /login 1;
    /workspace 1;
}

# During the temporary FG port recovery, retain the running gateway's canonical
# origin. Only the exact FG LAN origin is mapped; other origins stay unchanged.
map $http_origin $fg_six_browser_origin {
    default $http_origin;
    "https://192.168.0.99:3300" "https://192.168.0.99:3000";
}

log_format fg_5xx_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":"$status",'
    '"traceId":"$http_x_fg_trace_id",'
    '"requestId":"$request_id",'
    '"upstreamStatus":"$upstream_status",'
    '"upstreamAddress":"$upstream_addr",'
    '"upstreamConnectTime":"$upstream_connect_time",'
    '"upstreamHeaderTime":"$upstream_header_time",'
    '"upstreamResponseTime":"$upstream_response_time",'
    '"requestTime":"$request_time",'
    '"cfRay":"$http_cf_ray"}';

# Bound requests that reach the main app's NAS reader. Slow files must not
# occupy every DNS/filesystem worker or every browser connection.

upstream fg_studio_app {
    # Refresh the service address after Compose recreates the app container.
    zone fg_studio_app 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server app:3000 resolve;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Multiplex UI requests alongside long media and Agent streams.
    http2 on;
    server_name 192.168.0.99 localhost 127.0.0.1;

    access_log /dev/stdout fg_5xx_json if=$fg_log_5xx;
    access_log /dev/stdout fg_5xx_json if=$fg_log_entry_timing;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Asset uploads and video responses can be large; the app validates exact limits.
    # 素材上传和视频响应可能较大，具体业务限制仍由 App 校验。
    client_max_body_size 500m;

    # BEGIN FG SIX YINGCE ENTRY
    # FG sixth module only: every request retains the existing FG session gate.
    location = /fg-six { return 308 /fg-six/; }
    location ^~ /fg-six/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_public_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_public_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $fg_six_browser_origin;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
    location = /fg-audio-tools { return 307 /fg-six/fg-audio-tools$is_args$args; }
    # Older canvas bundles use absolute URLs for these bundled cover images.
    # Keep them on the FG workspace gateway, with its normal session gate.
    location ~ ^/(?:short-drama-styles/|welcome/wing-it/) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_cover_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_cover_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    # Keep the browser's public authority, including the mapped LAN port.
    location = /fg-director { return 307 $scheme://$http_host/app; }
    location = /fg-director/ { return 307 $scheme://$http_host/app; }
    location ~ ^/(?:fg-director/|app(?:/|$)|api/v1(?:/|$)|mcp(?:/|$)|agent-installation-guide\.md$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_director_public_upstream fg-six-yingce-gateway-1:3020;
        proxy_pass http://$fg_director_public_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $fg_six_browser_origin;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ~ ^/(?:creator-app$|creator-static/|creator-presets/|\.opencreator/|fonts/opencreator/|dashboard/.+\.(?:png|jpe?g|webp|svg|mp4)$|platforms/.+\.png$|advertising-app/|adcraft-api/|adcraft-static/|director-desk/) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_tool_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_tool_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $fg_six_browser_origin;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
    # Provider-only delivery uses native, expiring HMAC signed URLs. Other FG
    # or canvas APIs stay behind their existing authentication gates.
    location ~ "^/api/public/resources/([0-9a-f]{32}|[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12})/file$" {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_media_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_media_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /production-lab {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_entry_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_entry_upstream/fg/entry;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter 'src="https://192.168.0.99:3016/"' 'src="/fg-six/"';
        sub_filter 'microphone https://192.168.0.99:3016' 'microphone https://192.168.0.99:3000';
        sub_filter_once off;
    }
    location ^~ /production-lab/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fg_six_entry_upstream fg-six-yingce-gateway-1:3010;
        proxy_pass http://$fg_six_entry_upstream/fg/entry;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter 'src="https://192.168.0.99:3016/"' 'src="/fg-six/"';
        sub_filter 'microphone https://192.168.0.99:3016' 'microphone https://192.168.0.99:3000';
        sub_filter_once off;
    }
    # END FG SIX YINGCE ENTRY

    # Workspace HTML, Next assets and /api/version must come from the same app
    # build. A parallel old workspace image causes an upgrade loop on new logins.

    location / {
        proxy_http_version 1.1;
        proxy_pass http://fg_studio_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-FG-Trace-ID $http_x_fg_trace_id;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header X-Request-ID $request_id always;

        # Stream media and long-running generation requests without a proxy cutoff.
        # 媒体和长耗时生成请求采用流式转发，避免 Nginx 缓冲或过早超时。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
